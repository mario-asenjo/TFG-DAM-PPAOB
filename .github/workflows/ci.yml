name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend tests
        run: mvn test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build
        run: npm ci && npm run build
        working-directory: frontend

  workers-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static worker tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=src python -m pytest -q
        working-directory: workers/static
      - name: Dynamic worker tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt -r requirements-dev.txt
          PYTHONPATH=src python -m pytest -q
        working-directory: workers/dynamic
      - name: Build dynamic C agent
        run: make
        working-directory: agent-dynamic-c
