services:
  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: ppaob-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../../backend
    container_name: ppaob-backend
    environment:
      APP_RUNTIME_MODE: ${APP_RUNTIME_MODE:-dev}
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ppaob}
      DB_USER: ${DB_USER:-ppaob}
      DB_PASSWORD: ${DB_PASSWORD:-ppaob_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-change-this-in-production}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-ppaob_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      MAX_UPLOAD_FILE_SIZE: ${MAX_UPLOAD_FILE_SIZE:-20MB}
      MAX_UPLOAD_REQUEST_SIZE: ${MAX_UPLOAD_REQUEST_SIZE:-20MB}
      APP_UPLOAD_MAX_BYTES: ${APP_UPLOAD_MAX_BYTES:-20971520}
      APP_AUDIT_SYSTEM_USER_EMAIL: ${APP_AUDIT_SYSTEM_USER_EMAIL:-system@ppaob.local}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      S3_BUCKET: ${S3_BUCKET:-ppaob-binaries}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-static:
    build:
      context: ../../workers/static
    container_name: ppaob-worker-static
    environment:
      APP_RUNTIME_MODE: ${APP_RUNTIME_MODE:-dev}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ppaob}
      DB_USER: ${DB_USER:-ppaob}
      DB_PASSWORD: ${DB_PASSWORD:-ppaob_dev_password}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      S3_BUCKET: ${S3_BUCKET:-ppaob-binaries}
      WORKER_PROFILE: STATIC_BASELINE
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      APP_AUDIT_SYSTEM_USER_EMAIL: ${APP_AUDIT_SYSTEM_USER_EMAIL:-system@ppaob.local}
      APP_CORRELATION_ENV_PROFILE: ${APP_CORRELATION_ENV_PROFILE:-LINUX_SERVER}
      APP_CORRELATION_OBSERVED_RUNS: ${APP_CORRELATION_OBSERVED_RUNS:-1}
      APP_DEPLOYMENT_EXPOSURE: ${APP_DEPLOYMENT_EXPOSURE:-INTERNAL}
      APP_DEPLOYMENT_PRIVILEGE_LEVEL: ${APP_DEPLOYMENT_PRIVILEGE_LEVEL:-USER}
      APP_DEPLOYMENT_DATA_SENSITIVITY: ${APP_DEPLOYMENT_DATA_SENSITIVITY:-MEDIUM}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started

  worker-dynamic:
    build:
      context: ../../
      dockerfile: workers/dynamic/Dockerfile
    container_name: ppaob-worker-dynamic
    environment:
      APP_RUNTIME_MODE: ${APP_RUNTIME_MODE:-dev}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ppaob}
      DB_USER: ${DB_USER:-ppaob}
      DB_PASSWORD: ${DB_PASSWORD:-ppaob_dev_password}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      S3_BUCKET: ${S3_BUCKET:-ppaob-binaries}
      WORKER_PROFILE: DYNAMIC_BASELINE
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      DYNAMIC_AGENT_TIMEOUT_MS: ${DYNAMIC_AGENT_TIMEOUT_MS:-5000}
      APP_AUDIT_SYSTEM_USER_EMAIL: ${APP_AUDIT_SYSTEM_USER_EMAIL:-system@ppaob.local}
      APP_CORRELATION_ENV_PROFILE: ${APP_CORRELATION_ENV_PROFILE:-LINUX_SERVER}
      APP_CORRELATION_OBSERVED_RUNS: ${APP_CORRELATION_OBSERVED_RUNS:-1}
      APP_DEPLOYMENT_EXPOSURE: ${APP_DEPLOYMENT_EXPOSURE:-INTERNAL}
      APP_DEPLOYMENT_PRIVILEGE_LEVEL: ${APP_DEPLOYMENT_PRIVILEGE_LEVEL:-USER}
      APP_DEPLOYMENT_DATA_SENSITIVITY: ${APP_DEPLOYMENT_DATA_SENSITIVITY:-MEDIUM}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: ppaob-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppaob}
      POSTGRES_USER: ${POSTGRES_USER:-ppaob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppaob_dev_password}
    ports:
      - "65432:5432"
    volumes:
      - ppaob_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppaob} -d ${POSTGRES_DB:-ppaob}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ppaob-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - ppaob_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppaob_pgdata:
  ppaob_minio:
